<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b0a"/>
      <stop offset="50%" stop-color="#0d1411"/>
      <stop offset="100%" stop-color="#050807"/>
    </linearGradient>
    <radialGradient id="glow-emerald" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2a5235" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#14261a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#070b0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-lime" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4a6e30" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#14261a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070b0a" stop-opacity="0"/>
    </radialGradient>
    <!-- Accent Line Gradients -->
    <linearGradient id="brand-lime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#efffb0"/>
      <stop offset="50%" stop-color="#d9fa7b"/>
      <stop offset="100%" stop-color="#93c99b"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#557744" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#223326" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#213327" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="240" cy="140" r="260" fill="url(#glow-emerald)"/>
  <circle cx="960" cy="180" r="220" fill="url(#glow-lime)"/>

  <!-- Border Frame -->
  <rect x="16" y="16" width="1168" height="328" rx="14" fill="none" stroke="#2d4233" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="20" y="20" width="1160" height="320" rx="11" fill="none" stroke="#3d5a44" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Status Bar in Banner -->
  <g transform="translate(48, 52)">
    <!-- Network Indicator Badge -->
    <rect x="0" y="0" width="168" height="26" rx="13" fill="#121d16" stroke="#2e4735" stroke-width="1"/>
    <circle cx="15" cy="13" r="4.5" fill="#d9fa7b"/>
    <circle cx="15" cy="13" r="8" fill="#d9fa7b" fill-opacity="0.25"/>
    <text x="28" y="17" fill="#cbe3bd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">SUI TESTNET LIVE</text>

    <!-- Protocol Subtitle -->
    <text x="185" y="17" fill="#7d9181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="1.5">PRE-FLIGHT PAYMENT SAFETY DESK</text>
  </g>

  <!-- Left Side: Fingerprint Brand Icon & Typography -->
  <g transform="translate(48, 100)">
    <!-- Icon Container -->
    <rect x="0" y="10" width="84" height="84" rx="20" fill="#132018" stroke="#3d5942" stroke-width="1.5"/>
    <rect x="2" y="12" width="80" height="80" rx="18" fill="none" stroke="#d9fa7b" stroke-width="0.5" stroke-opacity="0.4"/>
    
    <!-- Fingerprint Geometry -->
    <g transform="translate(18, 28)" stroke="url(#brand-lime)" stroke-width="2.6" fill="none" stroke-linecap="round">
      <path d="M24 2 C13 2 4 10 4 23 C4 33 9 40 16 44"/>
      <path d="M24 10 C16 10 11 15 11 23 C11 30 14 35 19 38"/>
      <path d="M24 18 C20 18 18 20 18 24 C18 27 20 29 23 31"/>
      <path d="M24 2 C35 2 44 10 44 23 C44 33 39 40 32 44"/>
      <path d="M24 10 C32 10 37 15 37 23 C37 30 34 35 29 38"/>
      <path d="M24 18 C28 18 30 20 30 24 C30 27 28 29 25 31"/>
      <circle cx="24" cy="24" r="2.2" fill="#efffb0"/>
    </g>

    <!-- Main Title & Headlines -->
    <text x="108" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5">
      PAYEE <tspan fill="#d9fa7b">PASSPORT</tspan>
    </text>
    <text x="110" y="86" fill="#a4b8a7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif" font-size="16.5" font-weight="400" letter-spacing="0.2">
      Intelligent Pre-Flight Verification &amp; Wallet-Scoped Memory for Web3 Payments
    </text>
  </g>

  <!-- Bottom Feature Strip -->
  <g transform="translate(48, 235)">
    <!-- Feature Pill 1: Tatum gRPC -->
    <g transform="translate(0, 0)">
      <rect width="180" height="58" rx="10" fill="#0e1713" stroke="#25382b" stroke-width="1"/>
      <text x="16" y="24" fill="#849987" font-family="monospace" font-size="10" font-weight="600" letter-spacing="1">LIVE ON-CHAIN</text>
      <text x="16" y="44" fill="#e2ede0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Tatum Sui gRPC</text>
    </g>

    <!-- Feature Pill 2: Walrus Memory -->
    <g transform="translate(196, 0)">
      <rect width="180" height="58" rx="10" fill="#0e1713" stroke="#25382b" stroke-width="1"/>
      <text x="16" y="24" fill="#849987" font-family="monospace" font-size="10" font-weight="600" letter-spacing="1">CONTEXTUAL RECALL</text>
      <text x="16" y="44" fill="#e2ede0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Walrus Memory</text>
    </g>

    <!-- Feature Pill 3: OpenRouter AI -->
    <g transform="translate(392, 0)">
      <rect width="180" height="58" rx="10" fill="#0e1713" stroke="#25382b" stroke-width="1"/>
      <text x="16" y="24" fill="#849987" font-family="monospace" font-size="10" font-weight="600" letter-spacing="1">SYNTHESIS &amp; AUDIT</text>
      <text x="16" y="44" fill="#e2ede0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">OpenRouter AI</text>
    </g>

    <!-- Feature Pill 4: Zero-Trust Security -->
    <g transform="translate(588, 0)">
      <rect width="180" height="58" rx="10" fill="#0e1713" stroke="#25382b" stroke-width="1"/>
      <text x="16" y="24" fill="#849987" font-family="monospace" font-size="10" font-weight="600" letter-spacing="1">NON-CUSTODIAL</text>
      <text x="16" y="44" fill="#e2ede0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Personal Message Auth</text>
    </g>
  </g>

  <!-- Right Decorative Telemetry Readout Card -->
  <g transform="translate(850, 48)">
    <rect width="300" height="258" rx="12" fill="#0e1612" stroke="url(#card-border)" stroke-width="1.2"/>
    
    <!-- Telemetry Header -->
    <rect x="14" y="14" width="8" height="8" rx="2" fill="#d9fa7b"/>
    <text x="28" y="22" fill="#d9fa7b" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">TELEMETRY PREVIEW</text>
    
    <!-- Code / Data Readout -->
    <g transform="translate(14, 38)" font-family="monospace" font-size="10.5">
      <rect x="0" y="0" width="272" height="194" rx="7" fill="#070c09" stroke="#1f2f24" stroke-width="0.8"/>
      
      <text x="12" y="24" fill="#718674">&gt; Target Verification</text>
      <text x="12" y="44" fill="#93c99b">Status: <tspan fill="#d9fa7b">VERIFIED MATCH</tspan></text>
      
      <line x1="12" y1="56" x2="260" y2="56" stroke="#1c2d20" stroke-width="1"/>
      
      <text x="12" y="74" fill="#718674">&gt; Balance (SUI):</text>
      <text x="140" y="74" fill="#edf2ec">142.5080 SUI</text>
      
      <text x="12" y="94" fill="#718674">&gt; Outgoing Txs:</text>
      <text x="140" y="94" fill="#edf2ec">10 recent [OK]</text>
      
      <text x="12" y="114" fill="#718674">&gt; Walrus Memory:</text>
      <text x="140" y="114" fill="#edf2ec">Scoped Recalled</text>
      
      <text x="12" y="134" fill="#718674">&gt; Past Feedback:</text>
      <text x="140" y="134" fill="#88e09e">Expected Recipient</text>
      
      <line x1="12" y1="146" x2="260" y2="146" stroke="#1c2d20" stroke-width="1"/>

      <text x="12" y="166" fill="#a4bba8">&gt; AI Synthesis:</text>
      <text x="12" y="182" fill="#d9fa7b" font-size="9.5">"Known vendor address confirmed"</text>
    </g>
  </g>
</svg>

